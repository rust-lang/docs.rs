# Development tools managed by mise: https://mise.jdx.dev
#
# Install them with `mise install`. Rust itself continues to be managed by
# rustup, using the version pinned in rust-toolchain.toml.
[settings]
cargo.binstall = true
cargo.binstall_native = true
cargo.binstall_quickinstall = true

[tools]
actionlint = "1.7.12"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-sort" = "2.1.3"
"cargo:cargo-udeps" = "0.1.61"
"cargo:cargo-watch" = "8.5.3"
"cargo:mdbook" = "0.5.4"
"cargo:mdbook-linkcheck2" = "0.13.0"
"cargo:mdbook-mermaid" = "0.17.1"
"cargo:sqlx-cli" = "0.9.0"
deno = "2.9.6"
fd = "10.5.0"
hadolint = "2.15.1"
just = "1.58.0"
node = "24.20.0"
