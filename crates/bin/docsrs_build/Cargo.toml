[package]
name = "docsrs-build"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Run a docs.rs-compatible documentation build locally or in CI"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
docs_rs_build = { version = "0.6.0", path = "../../lib/docs_rs_build" }
docs_rs_build_limits = { version = "0.0.0", path = "../../lib/docs_rs_build_limits", default-features = false }
parse-size = "1.1.0"
rustwide = { version = "0.26.0", default-features = false, features = ["tracing", "unstable", "unstable-toolchain-ci"] }
tracing = { workspace = true }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "fmt"] }

[lints]
workspace = true
