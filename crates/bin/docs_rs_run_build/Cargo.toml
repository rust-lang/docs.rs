[package]
name = "docs_rs_run_build"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Run a docs.rs-compatible documentation build locally or in CI"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
docs_rs_build = { path = "../../lib/docs_rs_build" }
docs_rs_build_limits = { path = "../../lib/docs_rs_build_limits", default-features = false }
flate2 = { workspace = true }
humantime = "2.4.0"
parse-size = "1.1.0"
rustwide = { version = "0.26.0", default-features = false, features = ["tracing", "unstable", "unstable-toolchain-ci"] }
tar = "0.4.46"
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "fmt"] }

[lints]
workspace = true
