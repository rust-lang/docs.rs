{%- import "macros.html" as macros -%}
{%- decl build_slug2 -%}
{%- if build_slug is defined -%}
  {% let build_slug2 = build_slug -%}
{%- else -%}
  {%- let build_slug2 =  slug::slugify(crate::BUILD_VERSION) -%}
{%- endif -%}

{%- if let Some(css_file) = rustdoc_css_file -%}
    <link rel="stylesheet" href="/-/static/v/{{build_slug2}}/{{css_file}}" media="all" />
{%- endif -%}
<link rel="stylesheet" href="/-/static/v/{{build_slug2}}/font-awesome.css" media="all" />

<link rel="search" href="/-/static/v/{{build_slug2}}/opensearch.xml" type="application/opensearchdescription+xml" title="Docs.rs" />

<script type="text/javascript">{%- include "theme.js" -%}</script>
