---

name: Deploy
on:
  workflow_dispatch: {}

jobs:
  prod:
    name: Production
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/docker-pipeline.yml
    with:
      environment: production
      aws-iam: "760062276060:role/ci--rust-lang--docs.rs--production"
      cluster: docs-rs-prod
