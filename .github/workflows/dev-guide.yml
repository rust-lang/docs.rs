name: Dev-Guide mdBook

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Install development tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.5
          install_args: >-
            --jobs=1 just cargo:mdbook cargo:mdbook-linkcheck2
            cargo:mdbook-mermaid

      - run:
          just book-test  # also runs the build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/html

  # Deploy is run as a separate job as it needs elevated permissions
  deploy:
    name: deploy
    needs: test  # the `test` job uploads the pages artifact
    if: github.event_name == 'push' && github.repository == 'rust-lang/docs.rs'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
