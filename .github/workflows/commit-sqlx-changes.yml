on:
  push:
    branches:
      - main

# Keep one update PR current, including when pushes arrive close together.
concurrency:
  group: update-sqlx
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  RUST_CACHE_KEY: rust-cache-20241114
  DOCSRS_PREFIX: ignored/cratesfyi-prefix
  DOCSRS_LOG: docs_rs=debug,rustwide=info
  AWS_ACCESS_KEY_ID: cratesfyi
  AWS_SECRET_ACCESS_KEY: secret_key
  DOCSRS_INCLUDE_DEFAULT_TARGETS: false
  DOCSRS_DOCKER_IMAGE: ghcr.io/rust-lang/crates-build-env/linux-micro
  SENTRY_ENVIRONMENT: dev

permissions:
  contents: write
  pull-requests: write

jobs:
  commit-sqlx-changes:
    if: github.repository == 'rust-lang/docs.rs'
    runs-on: ubuntu-latest
    outputs:
      need_pr: ${{ steps.sqlx_check.outputs.need_pr }}
    steps:
      - uses: actions/checkout@v7

      - name: Ensure repository is up to date
        run: |
          git fetch origin
          git rebase origin/main

      - name: Install development tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.5
          install_args: --jobs=1 just cargo:sqlx-cli

      - name: restore build & cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ env.RUST_CACHE_KEY }}

      - name: Check for SQLx changes
        id: sqlx_check
        run: |
          just sqlx-update
          # Open or update a PR if the generated SQLx files differ from main.
          if [ -n "$(git status --porcelain .sqlx)" ]; then
            echo "need_pr=1" >> "$GITHUB_OUTPUT"
          else
            echo "need_pr=0" >> "$GITHUB_OUTPUT"
          fi

      - name: shut down test environment
        if: ${{ always() }}
        run: just compose-down-and-wipe

      - name: Open pull request
        if: ${{ steps.sqlx_check.outputs.need_pr == '1' }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update SQLX files
          committer: Docs.rs developers <docs.rs@users.noreply.github.com>
          author: Docs.rs developers <docs.rs@users.noreply.github.com>
          signoff: false
          add-paths: .sqlx
          delete-branch: true
          branch: update-sqlx
          title: Update SQLX files
          body: |
            Update the generated SQLX files to match main after ${{ github.sha }}.
