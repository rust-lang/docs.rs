name: Docker

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  test_docker_build:
    name: Test Docker images
    # PRs, branch pushes, and scheduled runs only build the images.
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      github.repository != 'rust-lang/docs.rs'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-pipeline.yml

  deploy_staging:
    name: Build docker images & deploy to staging
    # Only a push to main in the upstream repository publishes and deploys.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'rust-lang/docs.rs'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-pipeline.yml
    with:
      environment: staging
      aws-iam: "519825364412:role/ci--rust-lang--docs.rs--staging"
      cluster: docs-rs-staging
