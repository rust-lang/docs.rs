name: Docker pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub deployment environment; empty for CI only
        type: string
        default: ""
      aws-iam:
        description: Account and role to assume for publishing and deployment
        type: string
        default: ""
      cluster:
        description: ECS cluster; empty to skip publishing and deployment
        type: string
        default: ""

jobs:
  docker:
    name: Build and test Docker images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: docker-${{ inputs.environment || github.run_id }}
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        if: inputs.cluster != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-iam }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: inputs.cluster != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, smoke-test, and optionally publish Docker images
        uses: docker/bake-action@v7
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          source: .
          files: docker-bake.hcl
          # Each runtime stage runs its smoke test before exporting the image.
          # ECR_REGISTRY enables publishing for targets with ECR repositories.
          set: |
            *.cache-from=type=gha,scope=docs-rs-images
            *.cache-to=type=gha,mode=max,scope=docs-rs-images

      - name: Deploy web service
        if: inputs.cluster != ''
        env:
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: docs-rs-web
        shell: bash
        run: |
          # The web task definition continues to use the latest image tag.
          aws ecs update-service --service "$SERVICE" --cluster "$CLUSTER" --force-new-deployment
          aws ecs wait services-stable --services "$SERVICE" --cluster "$CLUSTER"
