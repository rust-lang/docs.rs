name: test local crates-build-env build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: restore build & cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ env.RUST_CACHE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: clone test crate
        run: git clone git@github.com:hyperium/headers.git

      - name: run tests
        run: just cli-test-local-build-image ghcr.io/rust-lang/crates-build-env/linux-micro ./headers

      - name: shut down test environment
        if: ${{ always() }}
        run: just compose-down-and-wipe
